<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1325" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle with Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="2" />

  <!-- Orbital Ring -->
  <ellipse cx="32" cy="32" rx="20" ry="8" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.6" transform="rotate(-25 32 32)" />

  <!-- Central Earth Observation Globe -->
  <circle cx="32" cy="32" r="10" fill="#0e2238" stroke="#22d3ee" stroke-width="2" filter="url(#glow)" />
  <ellipse cx="32" cy="32" rx="4.5" ry="9.5" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" />
  <line x1="22" y1="32" x2="42" y2="32" stroke="#38bdf8" stroke-width="1.2" opacity="0.7" />

  <!-- Satellite Body & Solar Panels -->
  <g transform="translate(14, -14)">
    <!-- Satellite Body -->
    <rect x="29" y="29" width="6" height="6" rx="1.5" fill="#22d3ee" filter="url(#glow)" />
    <!-- Solar Array Wings -->
    <line x1="24" y1="32" x2="29" y2="32" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="35" y1="32" x2="40" y2="32" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <!-- Signal Beam Indicator -->
    <circle cx="32" cy="32" r="1.5" fill="#34d399" />
  </g>

  <!-- Radar Pulse Rings -->
  <circle cx="32" cy="32" r="17" stroke="#22d3ee" stroke-width="1" opacity="0.25" />
  <circle cx="32" cy="32" r="23" stroke="#22d3ee" stroke-width="0.75" opacity="0.15" />
</svg>